<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Membership Joining Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #ffd700;
            padding: 20px;
        }

        h2, h3 {
            color: #ff8c00;
            border-bottom: 2px solid #ff8c00;
            padding-bottom: 5px;
        }

        form {
            background-color: #1a1a1a;
            padding: 20px;
            margin: 0 auto;
            width: 50%;
            border: 2px solid #ff8c00;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #ffd700;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ffd700;
            border-radius: 5px;
            background-color: #000;
            color: #ffd700;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 10px;
        }

        button[type="submit"] {
            background-color: #ff8c00;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button[type="submit"]:hover {
            background-color: #e57c00;
        }

        input:focus,
        textarea:focus {
            border-color: #ff8c00;
            box-shadow: 0 0 5px rgba(255, 140, 0, 0.5);
        }
    </style>
</head>
<body>

    <form onsubmit="showAlert(event)">
        <h2>Gym Membership Joining Form</h2>

        <h3>Personal Information</h3>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male"> Male
        <input type="radio" id="female" name="gender" value="female"> Female
        <input type="radio" id="other" name="gender" value="other"> Other

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile" required>

        <h3>Contact Information</h3>
        <label for="address">Address:</label>
        <textarea id="address" name="address" required></textarea>

        <label for="city">City:</label>
        <input type="text" id="city" name="city" required>

        <label for="state">State:</label>
        <input type="text" id="state" name="state" required>

        <label for="zip">Zip Code:</label>
        <input type="number" id="zip" name="zip" required>

        <h3>Gym Membership Details</h3>
        <label for="membership_type">Membership Type:</label>
        <input type="radio" id="monthly" name="membership_type" value="monthly"> Monthly
        <input type="radio" id="quarterly" name="membership_type" value="quarterly"> Quarterly
        <input type="radio" id="annually" name="membership_type" value="annually"> Annually

        <label for="workout_time">Preferred Workout Time:</label>
        <input type="checkbox" id="morning" name="workout_time" value="morning"> Morning
        <input type="checkbox" id="afternoon" name="workout_time" value="afternoon"> Afternoon
        <input type="checkbox" id="evening" name="workout_time" value="evening"> Evening

        <label for="fitness_goals">Fitness Goals:</label>
        <input type="checkbox" id="weight_loss" name="fitness_goals" value="weight_loss"> Weight Loss
        <input type="checkbox" id="muscle_gain" name="fitness_goals" value="muscle_gain"> Muscle Gain
        <input type="checkbox" id="cardio" name="fitness_goals" value="cardio"> Cardiovascular Health

        <h3>Additional Information</h3>
        <label for="hear_about_us">How did you hear about us?</label>
        <input type="radio" id="social_media" name="hear_about_us" value="social_media"> Social Media
        <input type="radio" id="referral" name="hear_about_us" value="referral"> Friend/Family Referral
        <input type="radio" id="online_search" name="hear_about_us" value="online_search"> Online Search

        <label for="medical_conditions">Any medical conditions or concerns?</label>
        <textarea id="medical_conditions" name="medical_conditions"></textarea>

        <button type="submit">Submit</button>
    </form>

    <script>
        function showAlert(event) {
            event.preventDefault(); 
            alert("Thankyou Your Data has been recorded. Welcome To Fitness Crew.");
			window.location.href="projectindex.html";
        }
    </script>
</body>
</html>
